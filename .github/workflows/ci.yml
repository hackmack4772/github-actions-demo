name: HTML JS CI CD Pipeline

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main

# Workflow-level environment variables
env:
  APP_NAME: github-actions-demo
  NODE_VERSION: '22'

# Default permissions
permissions:
  contents: read

jobs:
  # ==========================================
  # STAGE 1: VALIDATION
  # ==========================================
  validate:
    name: Stage 1 - Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Display environment
        run: |
          echo "Application: $APP_NAME"
          echo "Node version: $(node --version)"

      - name: Validate required files
        run: |
          test -f index.html
          test -f src/style.css
          test -f src/script.js
          echo "All required files exist."

      - name: Check JavaScript syntax
        run: node --check src/script.js

      - name: Validation completed
        run: echo "Validation successful!"

  # ==========================================
  # STAGE 2: BUILD
  # ==========================================
  build:
    name: Stage 2 - Build
    runs-on: ubuntu-latest

    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create build directory
        run: |
          mkdir -p dist/src

      - name: Copy application files
        run: |
          cp index.html dist/
          cp src/style.css dist/src/
          cp src/script.js dist/src/

      - name: Verify build output
        run: |
          echo "Build contents:"
          find dist -type f

          test -f dist/index.html
          test -f dist/src/style.css
          test -f dist/src/script.js

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ==========================================
  # STAGE 3: DEPLOY
  # ==========================================
  deploy:
    name: Stage 3 - Deploy
    runs-on: ubuntu-latest

    needs: build

    # Deploy only on main branch push

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment completed
        run: |
          echo "Application deployed successfully!"
          echo "Website: ${{ steps.deployment.outputs.page_url }}"
