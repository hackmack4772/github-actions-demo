name: HTML JS CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  APP_NAME: github-actions-demo
  ENVIRONMENT: development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display environment variables
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      - name: Check HTML file
        run: |
          test -f index.html
          echo "HTML file exists"

      - name: Check JavaScript file
        run: |
          test -f src/script.js
          echo "JavaScript file exists"

      - name: Check CSS file
        run: |
          test -f src/style.css
          echo "CSS file exists"

      - name: Pipeline completed
        run: echo "CI Pipeline successful!"
